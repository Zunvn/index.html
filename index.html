<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nhận Mã Kích Hoạt</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 28px 22px;
      max-width: 390px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin: 0; }
    .code-box {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 8px;
      background: #0f172a;
      border: 1px dashed #475569;
      border-radius: 14px;
      padding: 16px 10px;
      margin: 20px 0;
      color: #facc15;
      user-select: all;
    }
    button {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .note { margin-top: 12px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body oncontextmenu="return false;">
  <div class="card">
    <h1>Mã xác nhận của bạn</h1>
    <p>Sao chép mã 6 số bên dưới và gửi lại vào Bot Telegram để tiếp tục.</p>
    <div class="code-box" id="codeDisplay">------</div>
    <button type="button" id="copyBtn" onclick="copyCode()">Sao chép mã</button>
    <div class="note">Mỗi mã chỉ dùng một lần cho phiên hiện tại.</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = (params.get("code") || "").replace(/\D/g, "").slice(0, 6);
    const display = document.getElementById("codeDisplay");
    const btn = document.getElementById("copyBtn");
    const desc = document.querySelector("p");

    if (code.length === 6) {
      display.textContent = code;
    } else {
      display.textContent = "------";
      btn.style.display = "none";
      desc.textContent = "Đường dẫn không có mã 6 số hợp lệ. Vui lòng quay lại Bot Telegram để lấy link mới.";
    }

    function copyCode() {
      if (code.length !== 6) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).catch(() => fallbackCopy(code));
      } else {
        fallbackCopy(code);
      }
      btn.textContent = "Đã sao chép mã!";
      setTimeout(() => { btn.textContent = "Sao chép mã"; }, 2000);
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
  </script>
</body>
</html>
